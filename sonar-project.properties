# Chave e nome do projeto no SonarCloud
sonar.projectKey=${env.SONAR_PROJECT_KEY}
sonar.projectName=Woodflow - Gerenciador de Projetos de Móveis
sonar.projectVersion=1.0

# Organização no SonarCloud
sonar.organization=${env.SONAR_ORGANIZATION}

# Código-fonte analisado
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/build/**,**/.git/**,**/init.sql,**/coverage/**

# Linguagem principal
sonar.language=js
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8
