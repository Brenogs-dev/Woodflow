name: Woodflow CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-analyze:
    name: Build, Test & SonarCloud
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout do código
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # necessário para o SonarCloud analisar o histórico completo

      # 2. Configurar Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # 3. Instalar dependências do Backend
      - name: Instalar dependências do Backend
        working-directory: ./backend
        run: npm install

      # 4. Build do Frontend
      - name: Instalar dependências do Frontend
        working-directory: ./frontend
        run: npm install

      - name: Build do Frontend
        working-directory: ./frontend
        run: npm run build

      # 5. Análise SonarCloud
      - name: Análise SonarCloud
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}

      # 6. Build das imagens Docker
      - name: Build das imagens Docker
        run: docker compose build

  deploy:
    name: Deploy (Docker Compose Up)
    runs-on: ubuntu-latest
    needs: build-and-analyze
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Subir containers com Docker Compose
        run: |
          docker compose up -d
          echo "Containers iniciados com sucesso."

      - name: Verificar status dos containers
        run: docker compose ps
