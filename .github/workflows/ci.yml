name: Woodflow CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-analyze:
    name: Build, Test & SonarCloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Instalar dependências do Backend
        working-directory: ./backend
        run: npm install --ignore-scripts

      - name: Instalar dependências do Frontend
        working-directory: ./frontend
        run: npm install --ignore-scripts

      - name: Build do Frontend
        working-directory: ./frontend
        run: npm run build

      - name: Análise SonarCloud
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.projectKey=Brenogs-dev_Woodflow
            -Dsonar.organization=brenogsdev

      - name: Build das imagens Docker
        run: docker compose build

  deploy:
    name: Deploy (Docker Compose Up)
    runs-on: ubuntu-latest
    needs: build-and-analyze
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Subir containers com Docker Compose
        run: |
          docker compose up -d
          echo "Containers iniciados com sucesso."

      - name: Verificar status dos containers
        run: docker compose ps
